<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — TransferWire</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1f3b2c;color:#f4f1e4;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:2rem;margin:16px 0 8px;letter-spacing:.02em;text-transform:uppercase}
  p{margin:0 0 20px;opacity:.85;max-width:28rem}
  button{background:#e3ac4e;color:#2b1f08;border:0;border-radius:6px;padding:10px 20px;font-size:1rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" width="96" height="96" alt="" style="border-radius:20px">
  <h1>You're offline</h1>
  <p>TransferWire needs a connection to load players, clubs and matches. Check your signal and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
